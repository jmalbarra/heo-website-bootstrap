    Esta página se dio de baja. Su contenido vive en la home, en #nosotros.

    No alcanza con borrarla del repo: eso ya se hizo, y el archivo viejo siguió
    online igual. El deploy sube con "mirror -R" sin --delete, así que lo que
    sacamos del repo se queda para siempre en el servidor. La única forma de
    pisar el archivo viejo desde acá es subir uno nuevo con el mismo nombre.
    Este es ese archivo: reemplaza las 156 líneas de plantilla abandonada que
    estaban arriba.

    La baja de verdad la hace el 301 del .htaccess, que ataja el pedido antes
    de que el server llegue a abrir esto. Queda como respaldo por si el hosting
    no tiene mod_rewrite: ahí el visitante llega igual a la sección correcta, y
    el noindex saca la URL vieja del buscador.
  -->
