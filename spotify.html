<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Abriendo Spotify… · Hacia el Ocaso</title>
	<meta name="robots" content="noindex, follow">
	<meta name="theme-color" content="#050507">

	<!--
		Antes acá había un <meta http-equiv="refresh" content="0;url=…">, y eso
		era el problema: el redirect a cero segundos le corre una carrera al
		pixel y la gana casi siempre. El navegador se iba de la página con el
		beacon a medio salir, así que una parte de los clicks de las campañas
		que apuntaron acá nunca se registró.
		Ahora redirige HEO.redirigir(): manda los eventos y recién cuando
		terminaron cambia de página. Son unos 300 ms, no se notan.
		El <noscript> de abajo mantiene el refresh para quien no tenga JS.
	-->
	<noscript><meta http-equiv="refresh" content="0;url=https://open.spotify.com/album/78mapk8m7x0773C0wxsSwy"></noscript>

	<script src="js/heo-track.js" data-heo-modo="redirect"></script>
	<script>
	/*
		?tema= — LA PÁGINA PUENTE DE LA ETAPA 3
		═══════════════════════════════════════

		La etapa 2 mandó 964 visitas a /escucha?tema=parias y Parias bajó de
		60 a 26 streams semanales. En esa landing el 98,6% de la gente nunca
		tocó Spotify, y el reproductor embebido le regala 30 segundos de
		muestra a quien no tiene sesión, que no cuentan como stream.

		Esta página saca la landing del medio: el anuncio apunta acá, salen
		PageView y ClickOut, y en unos 300 ms la persona está en el tema en
		Spotify. Para Meta es casi igual que tener landing (ve la visita, arma
		el público de quienes hicieron clic); para la persona es ir directo.

		Sin ?tema= sigue llevando al álbum, que es lo que hacía siempre. Los
		IDs son los mismos del mapa de escucha.html: si se suma un tema, va en
		los dos lados.
	*/
	(function () {
		var ALBUM = 'https://open.spotify.com/album/78mapk8m7x0773C0wxsSwy';
		var TEMAS = {
			'intronicte':  '68JTF9FvHvOjDBJIiw77OF',
			'erial':       '6R7TAMMJevYXkU7D1mwEvj',
			'parias':      '5F72tR0bk13gPUQrQ0q4kh',
			'mitos':       '62luIT5gtUMpImUPjqEwyl',
			'cifra':       '1MZ5DjHIreojxKW1gCHe6y',
			'gaia':        '1RiENIr2qOh8yPcMyLNXCx',
			'sicofante':   '1U2If5cjdH5QAsZIB9DTeN',
			'anamnesis':   '4swTtcUKN4jvq4Cm9w4Tbm',
			'lo-que-siento': '6V6W26IzwygZmk7IaWEhO1',
			'cae-el-velo': '0VjFiiwEl0iHdfoulKLPZk',
			'conexion':    '0Ge5ZlpL6ahDmVJRZZydDZ',
			'union':       '0vVOAAEKwq5H7dGoz2Ulh1'
		};

		var pedido = '';
		try {
			var m = window.location.search.match(/[?&]tema=([^&]*)/);
			if (m) pedido = decodeURIComponent(m[1]).toLowerCase().replace(/[^a-z0-9-]/g, '');
		} catch (_) {}

		var tema = TEMAS[pedido] ? pedido : null;
		var url = tema ? 'https://open.spotify.com/track/' + TEMAS[tema] : ALBUM;

		document.addEventListener('DOMContentLoaded', function () {
			// El link de "si no pasa nada" tiene que ir al mismo lugar.
			var a = document.getElementById('a-mano');
			if (a) a.href = url;
			HEO.redirigir('spotify', url, tema);
		});
	})();
	</script>

	<style>
		html, body { height: 100%; margin: 0; }
		body {
			background: #050507;
			color: #22eec9;
			font-family: "Geist Mono", ui-monospace, "Courier New", monospace;
			display: flex;
			flex-direction: column;
			gap: 14px;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 24px;
		}
		p { margin: 0; font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; }
		.tenue { color: rgba(34, 238, 201, 0.5); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: none; }
		a { color: #22eec9; }
		.punto {
			width: 7px; height: 7px; border-radius: 50%;
			background: #22eec9; animation: latir 0.9s ease-in-out infinite;
		}
		@keyframes latir { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .punto { animation: none; } }
	</style>
</head>
<body>
	<span class="punto" aria-hidden="true"></span>
	<p>Abriendo Spotify</p>
	<p class="tenue">
		Si no pasa nada, <a id="a-mano" href="https://open.spotify.com/album/78mapk8m7x0773C0wxsSwy">entrá acá</a>.
		<br>O mirá <a href="escucha.html">todas las formas de escucharlo</a>.
	</p>
</body>
</html>
