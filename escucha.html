<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Escuchá Mitos De Un Futuro Cercano · Hacia el Ocaso</title>
	<meta name="description" content="El álbum de Hacia el Ocaso. Metal alternativo de Buenos Aires. Escuchalo acá mismo.">
	<meta name="theme-color" content="#050507">

	<meta property="og:type" content="music.album">
	<meta property="og:title" content="Mitos De Un Futuro Cercano · Hacia el Ocaso">
	<meta property="og:description" content="El álbum completo. Metal alternativo de Buenos Aires.">
	<meta property="og:image" content="https://haciaelocaso.com/images/mdufc-banner.jpg">
	<meta property="og:image:width" content="1456">
	<meta property="og:image:height" content="816">
	<meta property="og:url" content="https://haciaelocaso.com/escucha">
	<meta name="twitter:card" content="summary_large_image">

	<link rel="canonical" href="https://haciaelocaso.com/escucha">
	<link rel="icon" href="images/favicon.ico" type="image/x-icon">

	<!-- El reproductor viene de open.spotify.com: abrir la conexión temprano le
	     saca medio segundo al iframe, que es lo más pesado de la página. -->
	<link rel="preconnect" href="https://open.spotify.com">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/escucha.css">

	<!-- Pixel de Meta + GA4 + eventos de salida. El ID vive en ese archivo. -->
	<script src="js/heo-track.js"></script>
</head>

<body>

	<!--
		POR QUÉ ESTA PÁGINA ES ASÍ
		══════════════════════════

		Dos campañas y ~75 USD dijeron esto: el tráfico se consigue barato
		(0,05 USD la visita) y no sirve de nada. Las reproducciones de Spotify no
		se movieron. El track 1 del disco tuvo 17 en una semana en la que
		supuestamente decenas de personas habían entrado a escucharlo.

		La versión anterior de esta página mandaba a Spotify y daba el trabajo
		por hecho. No lo estaba: ni Spotify ni YouTube arrancan solos. La persona
		aterrizaba en una app, veía un disco de una banda que no conoce, y
		todavía tenía que decidir apretar play. Ahí se perdía casi todo.

		Entonces el disco ahora suena acá. Tres cambios, todos al mismo problema:

		1. REPRODUCTOR EMBEBIDO. Escuchan sin saltar de app y sin decidir nada.
		   Si no están logueados en Spotify oyen 30 segundos de preview, que no
		   cuentan como reproducción — pero convierten "banda desconocida" en
		   "esto me gusta", y recién ahí el botón tiene sentido.

		2. UNA SOLA ACCIÓN. Antes había dos botones del mismo tamaño y un kicker
		   que decía "elegí dónde": la página pedía una decisión antes que una
		   acción. Para alguien que venía scrolleando, una bifurcación es una
		   salida. YouTube queda como link de texto para quien lo prefiera.

		3. DOS LÍNEAS QUE DICEN QUÉ ES ESTO. La versión anterior asumía que ya
		   querías el disco. Quien llega de un anuncio no sabe ni el género.

		LO QUE PERDEMOS, Y HAY QUE TENERLO PRESENTE
		Las reproducciones dentro del iframe no las podemos ver: es de Spotify y
		no deja mirar adentro. O sea que ClickOut va a bajar y eso NO va a querer
		decir que la página empeoró. El número que manda ahora es el de Spotify
		for Artists, que es el único que en todo esto nunca mintió.
	-->
	<main class="link" data-heo-content="mitos-de-un-futuro-cercano" data-heo-view>

		<header class="link__head">
			<!--
				La tapa grande se esconde en pantallas bajas (ver escucha.css): el
				reproductor ya trae su propia portada, así que ahí es espacio que
				se puede ceder para que el botón entre sin scrollear.
			-->
			<img src="images/mdufc-tapa.jpg" alt="Tapa de Mitos De Un Futuro Cercano"
			     class="link__cover" width="320" height="320" fetchpriority="high">
			<p class="link__band">Hacia el Ocaso</p>
			<h1 class="link__album">Mitos De Un Futuro Cercano</h1>

			<!--
				REEMPLAZAR CON LA VOZ DE LA BANDA. Lo armé con datos que se
				verifican (género, ciudad, doce temas, el título del disco) y sin
				inventar nada del concepto. Dos líneas, concreto, sin adjetivos de
				prensa. Es la parte que más puede mover el número y la única que
				no se puede escribir bien desde afuera.
			-->
			<p class="link__hook">
				Metal alternativo de Buenos Aires.<br>
				Doce temas sobre un futuro que ya llegó.
			</p>
		</header>

		<!--
			El embebido compacto (152px) y no el grande (352px): esta página tiene
			que resolverse en una pantalla de celular con la barra del navegador
			puesta, y cada píxel que gasta el reproductor es un píxel que empuja
			el botón abajo del pliegue.

			Sin loading="lazy" a propósito: es el contenido principal y está arriba
			de todo, no hay nada que diferir.
		-->
		<div class="player" id="player"></div>

		<noscript>
			<p class="player__sinjs">
				<a href="https://open.spotify.com/album/78mapk8m7x0773C0wxsSwy" rel="noopener">
					Escuchar el álbum en Spotify
				</a>
			</p>
		</noscript>

		<script>
		/*
			POR QUÉ LA PÁGINA ACEPTA ?tema=
			═══════════════════════════════

			Si el anuncio suena Parias y la persona entra, el reproductor del
			álbum le arranca por el track 1, que es Intronicte: un intro de
			minuto y medio. O sea que escucha algo distinto de lo que la trajo,
			en los dos segundos en los que decide si se queda.

			Con ?tema=parias el reproductor abre directamente en esa canción. La
			URL del anuncio la lleva, y lo que suena es lo que prometió.

			Sin el parámetro queda el álbum entero, que es lo correcto para quien
			llega por el link de siempre.

			El iframe lo crea este script en vez de venir en el HTML para no
			pedirle dos veces a Spotify: si el src viniera puesto, el navegador
			empezaría a bajar el álbum antes de que pudiéramos cambiarlo por el
			tema. El <noscript> de arriba cubre a quien no tenga JavaScript, y
			.player:empty en el CSS evita que quede un recuadro vacío.
		*/
		(function () {
			var ALBUM = '78mapk8m7x0773C0wxsSwy';

			// Los doce temas del disco. Están todos aunque hoy sólo se use uno:
			// que la próxima campaña no tenga que volver a buscar los IDs.
			var TEMAS = {
				'intronicte':  '68JTF9FvHvOjDBJIiw77OF',
				'erial':       '6R7TAMMJevYXkU7D1mwEvj',
				'parias':      '5F72tR0bk13gPUQrQ0q4kh',
				'mitos':       '62luIT5gtUMpImUPjqEwyl',
				'cifra':       '1MZ5DjHIreojxKW1gCHe6y',
				'gaia':        '1RiENIr2qOh8yPcMyLNXCx',
				'sicofante':   '1U2If5cjdH5QAsZIB9DTeN',
				'anamnesis':   '4swTtcUKN4jvq4Cm9w4Tbm',
				'lo-que-siento': '6V6W26IzwygZmk7IaWEhO1',
				'cae-el-velo': '0VjFiiwEl0iHdfoulKLPZk',
				'conexion':    '0Ge5ZlpL6ahDmVJRZZydDZ',
				'union':       '0vVOAAEKwq5H7dGoz2Ulh1'
			};

			var pedido = '';
			try {
				var m = window.location.search.match(/[?&]tema=([^&]*)/);
				if (m) pedido = decodeURIComponent(m[1]).toLowerCase().replace(/[^a-z0-9-]/g, '');
			} catch (_) {}

			var id = TEMAS[pedido];
			var tipo = id ? 'track' : 'album';
			if (!id) id = ALBUM;

			var f = document.createElement('iframe');
			f.title = 'Reproductor de Hacia el Ocaso en Spotify';
			f.src = 'https://open.spotify.com/embed/' + tipo + '/' + id + '?utm_source=generator&theme=0';
			f.width = '100%';
			f.height = '152';
			f.frameBorder = '0';
			f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
			f.allowFullscreen = true;
			document.getElementById('player').appendChild(f);

			// El botón acompaña: si acá suena un tema suelto, "escuchar completo"
			// tiene que llevar a ese tema y no al disco. Para quien no está
			// logueado la diferencia es real — acá oye 30 segundos y allá el tema
			// entero, que es exactamente lo que el botón promete.
			//
			// Va diferido porque este script corre donde está escrito, que es
			// antes del botón: si lo buscáramos ahora todavía no existe.
			// heo-track.js lee el href recién en el clic, así que cambiarlo
			// después no le molesta.
			if (tipo === 'track') {
				var ponerEnBoton = function () {
					var b = document.querySelector('[data-heo-out="spotify"]');
					if (b) b.href = 'https://open.spotify.com/track/' + id;
				};
				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', ponerEnBoton);
				} else {
					ponerEnBoton();
				}
			}
		})();
		</script>

		<div class="cta">

			<!--
				"El disco completo" y no "escuchar en Spotify": arriba ya pueden
				escuchar, así que el botón tiene que ofrecer algo distinto. Para
				quien no está logueado, lo distinto es real — acá suenan 30
				segundos y allá el tema entero.
			-->
			<a class="btn btn--spotify"
			   href="https://open.spotify.com/album/78mapk8m7x0773C0wxsSwy"
			   data-heo-out="spotify" rel="noopener">
				<svg class="btn__ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
					<path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.28a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.56-1.15a.75.75 0 1 1-.33-1.46c4.58-1.05 8.5-.6 11.67 1.33.35.22.46.68.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.99-8.15-2.56-11.97-1.4a.94.94 0 1 1-.55-1.8c4.37-1.32 9.8-.68 13.5 1.6.44.27.58.85.31 1.29zm.13-3.4C15.23 8.31 8.89 8.1 5.2 9.22a1.12 1.12 0 1 1-.65-2.15C8.79 5.78 15.79 6.03 20.2 8.65a1.12 1.12 0 0 1-1.1 1.96z"/>
				</svg>
				<span class="btn__txt">Escuchar completo</span>
				<span class="btn__arrow" aria-hidden="true">→</span>
			</a>

			<!--
				Va al primer video CON la playlist colgada (?v=…&list=…) y no a la
				página de la playlist. La diferencia es que un video arranca solo y
				la playlist no: es el mismo problema del play que estamos tratando
				de resolver, y acá se arregla con la URL. Al terminar sigue de tema
				en tema, que era la razón de usar la playlist en primer lugar.

				FI2cAzXjDUc es Erial, el primero de la playlist. Ojo: ese orden no
				es el del disco (el track 1 es Intronicte). Da la casualidad de que
				Erial es el tema más escuchado de la semana, así que como puerta de
				entrada sirve, pero si alguien reordena la playlist hay que cambiar
				este ID.
			-->
			<a class="alt"
			   href="https://www.youtube.com/watch?v=FI2cAzXjDUc&list=PLNJp1A05FLtg"
			   data-heo-out="youtube" rel="noopener">
				o escuchalo en YouTube
			</a>

		</div>

		<footer class="link__foot">
			<a href="https://www.instagram.com/heo.oficial" target="_blank"
			   rel="noopener noreferrer" data-heo-out="instagram">IG @heo.oficial</a>
			<p class="foot__copy">&copy; 2026 HEO</p>
		</footer>

	</main>

</body>
</html>
