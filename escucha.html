<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Escuchá Mitos De Un Futuro Cercano · Hacia el Ocaso</title>
	<meta name="description" content="El álbum de Hacia el Ocaso, en la plataforma que uses. Spotify, YouTube o acá mismo.">
	<meta name="theme-color" content="#050507">

	<meta property="og:type" content="music.album">
	<meta property="og:title" content="Mitos De Un Futuro Cercano · Hacia el Ocaso">
	<meta property="og:description" content="El álbum completo, en la plataforma que uses.">
	<meta property="og:image" content="https://haciaelocaso.com/images/mdufc-banner.jpg">
	<meta property="og:image:width" content="1456">
	<meta property="og:image:height" content="816">
	<meta property="og:url" content="https://haciaelocaso.com/escucha">
	<meta name="twitter:card" content="summary_large_image">

	<link rel="canonical" href="https://haciaelocaso.com/escucha">
	<link rel="icon" href="images/favicon.ico" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/escucha.css">

	<!-- Pixel de Meta + GA4 + eventos de salida. El ID vive en ese archivo. -->
	<script src="js/heo-track.js"></script>
</head>

<body>

	<!--
		data-heo-view hace que esta página mande ViewContent además de PageView.
		Es la única del sitio que lo manda: es la que recibe la pauta, así que es
		la única donde "alguien vio el disco" quiere decir algo.
	-->
	<main class="link" data-heo-content="mitos-de-un-futuro-cercano" data-heo-view>

		<header class="link__head">
			<img src="images/mdufc-tapa.jpg" alt="Tapa de Mitos De Un Futuro Cercano"
			     class="link__cover" width="320" height="320" fetchpriority="high">
			<p class="link__band">Hacia el Ocaso</p>
			<h1 class="link__album">Mitos De Un Futuro Cercano</h1>
			<p class="link__kicker">Álbum completo · elegí dónde</p>
		</header>

		<!--
			Spotify primero y solo, separado del resto. El objetivo de la pauta son
			streams: cada opción que compite arriba del scroll le saca clicks.
		-->
		<a class="btn btn--spotify"
		   href="https://open.spotify.com/album/78mapk8m7x0773C0wxsSwy"
		   data-heo-out="spotify" rel="noopener">
			<svg class="btn__ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
				<path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.28a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.56-1.15a.75.75 0 1 1-.33-1.46c4.58-1.05 8.5-.6 11.67 1.33.35.22.46.68.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.99-8.15-2.56-11.97-1.4a.94.94 0 1 1-.55-1.8c4.37-1.32 9.8-.68 13.5 1.6.44.27.58.85.31 1.29zm.13-3.4C15.23 8.31 8.89 8.1 5.2 9.22a1.12 1.12 0 1 1-.65-2.15C8.79 5.78 15.79 6.03 20.2 8.65a1.12 1.12 0 0 1-1.1 1.96z"/>
			</svg>
			<span class="btn__txt">Escuchar en Spotify</span>
			<span class="btn__arrow" aria-hidden="true">→</span>
		</a>

		<p class="link__or"><span>o</span></p>

		<!--
			YouTube va a la playlist del álbum, no al video suelto: el objetivo de la
			pauta es que escuchen el disco, y una playlist sigue sola de tema en tema
			mientras que un video termina y devuelve a las recomendaciones de YouTube.
		-->
		<a class="btn btn--youtube"
		   href="https://www.youtube.com/playlist?list=PLNJp1A05FLtg"
		   data-heo-out="youtube" rel="noopener">
			<svg class="btn__ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
				<path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/>
			</svg>
			<span class="btn__txt">Escuchar en YouTube</span>
			<span class="btn__arrow" aria-hidden="true">→</span>
		</a>

		<footer class="link__foot">
			<a class="foot__link" href="union/" data-heo-out="union">
				El último tema no tiene título: tiene una dirección →
			</a>
			<div class="foot__row">
				<a href="tienda/" data-heo-out="tienda">Tienda</a>
				<span aria-hidden="true">·</span>
				<a href="https://www.instagram.com/heo.oficial" target="_blank"
				   rel="noopener noreferrer" data-heo-out="instagram">IG @heo.oficial</a>
				<span aria-hidden="true">·</span>
				<a href="index.html" data-heo-out="home">El sitio</a>
			</div>
			<p class="foot__copy">&copy; 2026 HEO</p>
		</footer>

	</main>

</body>
</html>
